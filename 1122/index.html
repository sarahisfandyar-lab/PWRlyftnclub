<style>
  html{color-scheme:dark}
  html,body{margin:0;background:#000;color:#F5F5F7;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;}
  #root{min-height:100vh;}
  #boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .7s ease, transform .75s cubic-bezier(.4,0,.2,1)}
  #boot.gone{opacity:0;transform:scale(1.06);pointer-events:none}
  #boot .seq{position:relative;display:flex;flex-direction:column;align-items:center}
  #boot .pline{position:absolute;top:50%;left:50%;width:min(78vw,420px);height:1.5px;background:linear-gradient(90deg,transparent,#F2D9AE,#E0B26B,#F2D9AE,transparent);transform:translate(-50%,-50%) scaleX(0);transform-origin:center;opacity:0;will-change:transform,opacity}
  #boot .med{position:relative;width:min(58vw,240px);height:min(58vw,240px);display:flex;align-items:center;justify-content:center;opacity:0;will-change:transform,opacity,filter}
  #boot .med-glow{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(224,178,107,.4),rgba(242,217,174,.1) 44%,transparent 70%)}
  #boot .disc{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden}
  #boot .disc img{width:100%;height:100%;object-fit:contain;display:block}
  #boot .disc .sweep{position:absolute;top:-30%;left:0;width:34%;height:160%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(20deg) translateX(-180px);opacity:0;will-change:transform}
  #boot .word{margin-top:22px;display:flex;align-items:baseline;gap:7px;opacity:0;transform:translateY(14px);will-change:transform,opacity}
  #boot .word .bw{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;font-weight:800;font-size:26px;letter-spacing:.01em;background:linear-gradient(110deg,#F2D9AE,#E0B26B 55%,#B98A47);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #boot .word .bc{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-weight:500;font-size:13px;color:#8b8b95}
  #boot .tel{margin-top:20px;display:flex;gap:24px;opacity:0;transform:translateY(10px);will-change:transform,opacity}
  #boot .tel .t{display:flex;flex-direction:column;align-items:center;gap:5px}
  #boot .tel .t b{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;font-weight:400;font-size:17px;color:#cbd4dd;font-variant-numeric:tabular-nums}
  #boot .tel .t span{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:8px;letter-spacing:.2em;color:#5a5a63}
  #boot .skip{position:absolute;bottom:6.5%;left:0;right:0;text-align:center;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;letter-spacing:.22em;color:#42424a;opacity:0}
  #boot.cinematic .pline{animation:plineIn .55s cubic-bezier(.4,0,.2,1) .15s forwards, plineOut .5s ease 1s forwards}
  #boot.cinematic .med{animation:medIn .8s cubic-bezier(.2,.8,.25,1) .45s forwards}
  #boot.cinematic .disc .sweep{animation:sweepGo .85s ease .95s forwards}
  #boot.cinematic .word{animation:riseIn .6s cubic-bezier(.2,.8,.25,1) 1.15s forwards}
  #boot.cinematic .tel{animation:riseIn .6s cubic-bezier(.2,.8,.25,1) 1.5s forwards}
  #boot.cinematic .skip{animation:riseIn .6s ease 1.7s forwards}
  #boot.quick .pline,#boot.quick .tel,#boot.quick .skip{display:none}
  #boot.quick .med{opacity:1}
  #boot.quick .word{opacity:1;transform:none}
  @keyframes plineIn{from{transform:translate(-50%,-50%) scaleX(0);opacity:0}to{transform:translate(-50%,-50%) scaleX(1);opacity:1}}
  @keyframes plineOut{to{opacity:0}}
  @keyframes medIn{from{opacity:0;transform:scale(.82);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
  @keyframes sweepGo{0%{opacity:.9;transform:rotate(20deg) translateX(-180px)}100%{opacity:.9;transform:rotate(20deg) translateX(440px)}}
  @keyframes riseIn{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){#boot *{animation:none !important}#boot .med{opacity:1}#boot .word{opacity:1;transform:none}#boot .pline,#boot .tel,#boot .skip{display:none}}
</style>

<body>
<div id="root"></div>
<noscript><div style="padding:32px;text-align:center;font-family:-apple-system,sans-serif;color:#F5F5F7">PWRLYFTN needs JavaScript enabled to run.</div></noscript>
<div id="boot"><div class="seq"><div class="pline"></div><div class="med"><div class="med-glow"></div><div class="disc"><img src="pwrlyftn-logo.png" alt="PWRLYFTN Club" decoding="async" width="480" height="480"/><div class="sweep"></div></div></div><div class="word"><span class="bw">PWRLYFTN</span><span class="bc">Club</span></div><div class="tel"><div class="t"><b id="b1">0</b><span>ENGINE</span></div><div class="t"><b id="b2">0</b><span>SYNC</span></div><div class="t"><b id="b3">0</b><span>READY</span></div></div></div><div class="skip">TAP TO SKIP</div></div>
<script>
(function(){
  var boot=document.getElementById("boot"); if(!boot) return;
  var RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var first=!sessionStorage.getItem("pwr_booted");
  try{sessionStorage.setItem("pwr_booted","1");}catch(e){}
  var cinematic=first&&!RM;
  boot.classList.add(cinematic?"cinematic":"quick");
  function dissolve(){ if(boot.classList.contains("gone"))return; boot.classList.add("gone"); setTimeout(function(){ if(boot.parentNode)boot.parentNode.removeChild(boot); },720); }
  if(cinematic){
    setTimeout(function(){
      [["b1",100],["b2",100],["b3",100]].forEach(function(pr){
        var el=document.getElementById(pr[0]); if(!el)return; var t0=performance.now();
        (function s(now){var k=Math.min(1,(now-t0)/700);el.textContent=Math.round(pr[1]*(1-Math.pow(1-k,3)))+"%";if(k<1)requestAnimationFrame(s);})(performance.now());
      });
    },1050);
  }
  boot.addEventListener("click",dissolve,{once:true});
  setTimeout(dissolve, cinematic?2100:520);
  setTimeout(dissolve,5200);
})();
</script>

    function rec(kind, msg){ try{ localStorage.setItem('pwr_last_error', JSON.stringify({ kind: kind, msg: String(msg).slice(0,300), at: Date.now() })); }catch(e){} }
